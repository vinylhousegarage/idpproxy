<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>idpproxy</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
  <h1>idpproxy</h1>

  <form method="POST" action="/clients">

      id="redirect_uri"
      type="url"
      name="redirect_uri"
      required
    >
    <button type="submit">Register</button>
  </form>
</body>
</html>
